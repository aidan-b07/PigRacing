<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#1d2246"/>

  <!-- stars -->
  <g fill="#3a4278">
    <circle cx="60" cy="50" r="4"/><circle cx="300" cy="34" r="3"/><circle cx="520" cy="60" r="4"/>
    <circle cx="760" cy="36" r="3"/><circle cx="980" cy="58" r="4"/><circle cx="1140" cy="30" r="3"/>
    <circle cx="1110" cy="120" r="3"/><circle cx="40" cy="160" r="3"/>
  </g>

  <!-- cloud bank along the bottom -->
  <g fill="#262c58">
    <circle cx="40" cy="410" r="70"/><circle cx="150" cy="400" r="60"/><circle cx="260" cy="420" r="70"/>
    <circle cx="380" cy="410" r="56"/><circle cx="880" cy="420" r="64"/><circle cx="990" cy="400" r="70"/>
    <circle cx="1110" cy="412" r="66"/><circle cx="1200" cy="390" r="60"/>
  </g>

  <!-- checkpoint ring the pig just flew through -->
  <ellipse cx="118" cy="230" rx="24" ry="84" fill="none" stroke="#ff8fb8" stroke-width="12" opacity="0.35"/>

  <!-- the pig, same artwork as the icon -->
  <g transform="translate(130 22) scale(0.75)">
    <g stroke="#ff8fb8" stroke-width="14" stroke-linecap="round" opacity="0.4">
      <line x1="48" y1="268" x2="92" y2="268"/>
      <line x1="36" y1="312" x2="86" y2="312"/>
      <line x1="56" y1="356" x2="94" y2="356"/>
    </g>
    <g fill="#ff8fb8">
      <rect x="160" y="300" width="34" height="108" rx="14"/>
      <rect x="216" y="300" width="34" height="114" rx="14"/>
      <rect x="286" y="300" width="34" height="114" rx="14"/>
      <rect x="328" y="300" width="34" height="102" rx="14"/>
      <ellipse cx="250" cy="300" rx="134" ry="88"/>
      <circle cx="364" cy="262" r="72"/>
      <path d="M336 208 C332 186 342 168 358 164 C372 166 378 184 378 204 Z"/>
      <ellipse cx="422" cy="272" rx="28" ry="32"/>
    </g>
    <path fill="#e8709d" d="M348 172 C360 156 388 160 396 192 C384 196 366 190 354 182 Z"/>
    <ellipse cx="444" cy="272" rx="11" ry="30" fill="#f0739f"/>
    <path d="M120 286 C92 286 88 256 108 252 C124 250 126 274 108 276" fill="none" stroke="#ff8fb8" stroke-width="12" stroke-linecap="round"/>
    <circle cx="380" cy="238" r="11" fill="#1d2246"/>
    <ellipse cx="445" cy="266" rx="3.5" ry="8" fill="#1d2246"/>
    <path fill="#ffffff" stroke="#1d2246" stroke-width="14" stroke-linejoin="round"
          d="M300 236 C292 160 236 96 124 70
             Q130 110 160 120 Q146 154 184 164 Q176 196 214 204 Q210 232 244 244 Z"/>
  </g>

  <!-- title -->
  <text x="516" y="194" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="84" letter-spacing="2">
    <tspan fill="#ff8fb8">PIG</tspan><tspan fill="#ffffff"> RACING</tspan>
  </text>
  <text x="520" y="242" font-family="Arial, sans-serif" font-weight="700" font-size="26" fill="#b9c0e6">
    The flying-pig timed event for your Minecraft server
  </text>

  <!-- feature pills -->
  <g font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#ff8fb8" text-anchor="middle">
    <rect x="520" y="272" width="180" height="44" rx="22" fill="none" stroke="#ff8fb8" stroke-width="3"/>
    <text x="610" y="302">Timed Events</text>
    <rect x="716" y="272" width="150" height="44" rx="22" fill="none" stroke="#ff8fb8" stroke-width="3"/>
    <text x="791" y="302">Scheduled</text>
    <rect x="882" y="272" width="130" height="44" rx="22" fill="none" stroke="#ff8fb8" stroke-width="3"/>
    <text x="947" y="302">Rewards</text>
  </g>
</svg>
