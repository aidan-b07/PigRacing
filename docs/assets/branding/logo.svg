<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc8ff"/>
      <stop offset="1" stop-color="#bfe6ff"/>
    </linearGradient>
    <radialGradient id="body" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffc6d9"/>
      <stop offset="1" stop-color="#f290b3"/>
    </radialGradient>
    <clipPath id="badge"><circle cx="256" cy="256" r="236"/></clipPath>
  </defs>

  <!-- sky badge -->
  <circle cx="256" cy="256" r="244" fill="#2b5d8a"/>
  <circle cx="256" cy="256" r="236" fill="url(#sky)"/>

  <!-- clouds -->
  <g clip-path="url(#badge)" fill="#ffffff" opacity="0.9">
    <g transform="translate(70 420)">
      <circle cx="0" cy="0" r="38"/><circle cx="45" cy="-18" r="44"/><circle cx="95" cy="0" r="36"/>
      <rect x="0" y="0" width="95" height="40"/>
    </g>
    <g transform="translate(360 440)">
      <circle cx="0" cy="0" r="30"/><circle cx="40" cy="-16" r="38"/><circle cx="82" cy="0" r="30"/>
      <rect x="0" y="0" width="82" height="40"/>
    </g>
  </g>

  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.85">
    <line x1="52" y1="250" x2="100" y2="250"/>
    <line x1="40" y1="292" x2="98" y2="292"/>
    <line x1="60" y1="334" x2="104" y2="334"/>
  </g>

  <g stroke="#5a2238" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <!-- back wing -->
    <g transform="translate(34 -4) rotate(6 270 215)">
      <path fill="#dfe8f1" d="M290 215 C285 150 240 92 150 66
               Q156 100 178 108 Q168 138 198 146 Q192 174 222 180 Q218 204 242 218 Z"/>
    </g>

    <!-- back legs -->
    <path fill="#e9799f" d="M168 352 l-14 34 q-4 12 10 14 l18 0 q10 -2 10 -12 l2 -30 Z"/>
    <path fill="#e9799f" d="M300 360 l-6 34 q-2 12 12 12 l18 0 q10 -2 8 -12 l-4 -32 Z"/>

    <!-- tail -->
    <path fill="none" d="M126 282 C100 278 94 250 112 244 C128 238 134 262 116 266 C96 270 86 248 98 230"/>

    <!-- body -->
    <ellipse cx="250" cy="290" rx="132" ry="96" fill="url(#body)"/>

    <!-- front legs -->
    <path fill="#f290b3" d="M206 362 l-10 36 q-3 12 11 13 l18 0 q10 -2 9 -12 l0 -34 Z"/>
    <path fill="#f290b3" d="M336 352 l0 36 q0 12 13 12 l18 -1 q10 -2 7 -12 l-10 -34 Z"/>

    <!-- head -->
    <circle cx="372" cy="250" r="74" fill="url(#body)"/>

    <!-- ear -->
    <path fill="#f290b3" d="M330 196 L340 136 Q370 150 386 184 Z"/>
    <path fill="none" stroke-width="5" d="M342 160 Q358 170 366 186"/>

    <!-- snout -->
    <ellipse cx="440" cy="262" rx="28" ry="34" fill="#f57ba6"/>
  </g>

  <!-- nostrils -->
  <ellipse cx="433" cy="252" rx="5" ry="9" fill="#5a2238"/>
  <ellipse cx="450" cy="254" rx="5" ry="9" fill="#5a2238"/>

  <!-- eye -->
  <circle cx="388" cy="222" r="11" fill="#2a1420"/>
  <circle cx="392" cy="218" r="4" fill="#ffffff"/>

  <!-- blush -->
  <ellipse cx="392" cy="276" rx="16" ry="10" fill="#ff6f9c" opacity="0.45"/>

  <!-- smile -->
  <path d="M398 300 Q412 312 428 304" fill="none" stroke="#5a2238" stroke-width="6" stroke-linecap="round"/>

  <!-- front wing -->
  <g stroke="#5a2238" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <path fill="#ffffff" d="M290 222 C282 152 232 90 126 60
             Q132 98 158 106 Q146 140 180 148 Q172 180 206 186 Q200 212 232 226 Z"/>
    <g fill="none" stroke="#b9c7d6" stroke-width="5">
      <path d="M262 206 Q236 160 166 112"/>
      <path d="M252 214 Q228 186 190 152"/>
      <path d="M244 222 Q230 206 214 190"/>
    </g>
  </g>
</svg>
