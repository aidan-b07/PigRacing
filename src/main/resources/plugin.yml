name: PigRacing
version: '${project.version}'
main: dev.aidanbooth.pigracing.Main
# Lets 1.13+ load the plugin without legacy mode. Older servers ignore this.
api-version: '1.13'
softdepend:
  - Multiverse-Core
commands:
  race:
    description: Pig racing
    usage: /<command> help
    aliases:
      - pr
      - pigracing
      - pigrace
permissions:
  pigracing.start:
    description: Start a pig race
    default: op
  pigracing.admin:
    description: Set up tracks and manage races
    default: op
    children:
      pigracing.start: true
