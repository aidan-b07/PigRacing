# PigRacing configuration
# Colour codes use &. Speeds are in blocks per tick (20 ticks = 1 second).

Settings:
  # Laps to finish the race
  Laps: 3
  # Seconds players have to join after /race start
  JoinTime: 60
  # Seconds left when the join message is repeated in chat
  AnnounceAt: [30, 10, 5, 4, 3, 2, 1]
  # Fewer racers than this when joining closes cancels the race. /race forcestart ignores it.
  # A race nobody joined is always called off.
  MinPlayers: 2
  # Seconds between the last racer finishing and everyone being sent back
  EndDelay: 5
  # Racers this far from the start (or in another world) are sent back to their last ring
  MaxDistanceFromStart: 150
  # With a boundary set (/race pos1, /race pos2, /race setboundary) racers leaving that box are sent
  # back to their last ring instead, and MaxDistanceFromStart is ignored. 0 above turns the distance off.
  # Racers can't be hurt while racing
  ProtectRacers: true
  # Ticks a pig may sit on the ground at the start or after respawning before it counts as a crash
  GroundGraceTicks: 60
  # Pigs can land on these without crashing. * matches anything, e.g. "*_CARPET"
  SafeGroundBlocks:
    - "*CARPET"

# Prizes for racers who finish. Each entry is a list of commands run from the console, no slash.
# Placeholders: {player} name, {uuid}, {position} (1, 2, 3), {place} (1st, 2nd, 3rd), {time} race time,
# {racers} how many raced. Racers who leave, or who haven't finished when the race ends, get nothing.
Rewards:
  # By finishing place. List as many places as you like; places not listed get nothing extra.
  # For example:
  #   Places:
  #     1:
  #       - "give {player} diamond 3"
  #       - "say {player} won the pig race in {time}!"
  #     2:
  #       - "give {player} gold_ingot 5"
  #     3:
  #       - "give {player} iron_ingot 5"
  Places: {}
  # Run for everyone who finishes, after their place's commands
  AllFinishers: []

# Which commands players in a race may use. /race always works, so anyone can leave.
# Mode "whitelist": only the listed commands work. Mode "blacklist": everything but them works.
# Names without the slash; "plugin:command" forms are matched by the part after the colon.
Commands:
  # Signed up and waiting for the start, or finished and waiting for the others
  Waiting:
    Mode: blacklist
    List:
      - spawn
      - home
      - warp
      - tp
      - tpa
      - tpaccept
      - back
      - fly
  # On a pig, racing
  Racing:
    Mode: whitelist
    List:
      - msg
      - tell
      - w
      - r
      - reply
      - me

# Flappy-bird style: tap space to flap upwards, gravity pulls you back down. Holding space doesn't
# keep you climbing, so height comes from timing your taps. The pig flies the way its rider looks.
Flight:
  # Forward speed with no checkpoints passed
  BaseSpeed: 0.4
  # Extra speed for every checkpoint passed since the pig last crashed
  SpeedPerCheckpoint: 0.03
  MaxSpeed: 0.9
  # true: hold W to fly forward. false: the pig always flies forward.
  RequireForwardKey: true
  # Upward speed a flap gives, whatever the pig was doing. 0.42 rises about 1.5 blocks.
  JumpStrength: 0.42
  # Ticks after a flap before the next one counts
  JumpCooldownTicks: 3
  # Downward speed added every tick, up to MaxFallSpeed
  Gravity: 0.06
  MaxFallSpeed: 0.6
  # Ticks a pig holds its height after respawning, so you have time to get going
  RespawnHoverTicks: 30
  # How hard a racer punching another racer's pig knocks it, and how fast that fades (0-0.95)
  KnockbackStrength: 1.0
  KnockbackFade: 0.7

# Checkpoint rings, drawn in animated particles. Each racer's next ring is highlighted.
Rings:
  Enabled: true
  # Size used by /race addcheckpoint when none is given. A size 3 ring fits a 3x3 opening.
  DefaultSize: 3
  # Ticks between redraws. Lower looks smoother but sends more particles. Every particle is its own
  # packet on 1.8, so the counts below are kept low; raise them carefully.
  Interval: 2
  # Only rings this close to a player are drawn for them
  ViewDistance: 32
  # The two colours everything alternates between
  Color: "#FF55FF"
  SecondColor: "#FFFFFF"

  # Every ring: a faint outline (blocks between particles, 0 for none) and comets orbiting the rim
  OutlineSpacing: 0
  Comets: 4
  # Particles per comet, head included
  CometLength: 2
  SpinSpeed: 0.12

  # The ring a racer needs next: a dense breathing outline, faster comets, and a ripple that
  # shrinks from the rim to the centre
  NextOutlineSpacing: 0.5
  NextComets: 4
  NextCometLength: 4
  NextSpinSpeed: 0.25
  Ripple: true
  # How much of the way in the ripple moves each redraw (0.05 = one ripple every 20 redraws)
  RippleSpeed: 0.05
  # Blocks between particles in the ripple
  RippleSpacing: 0.7

# Sound names are modern Minecraft names; older servers get the closest match. Use "none" for silence.
Sounds:
  Countdown:
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 1.0
    pitch: 1.0
  Go:
    sound: BLOCK_NOTE_BLOCK_PLING
    volume: 1.0
    pitch: 1.5
  Checkpoint:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.0
  Lap:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.4
  Crash:
    sound: ENTITY_VILLAGER_DEATH
    volume: 1.0
    pitch: 1.0

Titles:
  # Shown before the start, counting down from the highest number
  Countdown:
    5: "&f5"
    4: "&f4"
    3: "&d3"
    2: "&d2"
    1: "&d&l1"
  CountdownSubtitle: "&7Get ready..."
  Go: "&d&lGO!"
  GoSubtitle: "&fFly through the &dpink &frings"
  # After each lap but the last. {lap}, {total}, {time}
  Lap: "&d&lLAP {lap}&7&l/&d&l{total}"
  LapSubtitle: "&7{time}"
  # After the second to last lap
  FinalLap: "&d&lFINAL LAP"
  FinalLapSubtitle: "&fBring it home!"
  Crashed: "&c&lCRASHED"
  CrashedSubtitle: "&fBack to your last ring"
  # {position} is 1st, 2nd... {time} is the race time
  Finished: "&d&l{position}"
  FinishedSubtitle: "&fFinished in &d{time}"

# {prefix} is replaced by Prefix below. Lines starting {center} are centred in chat.
Messages:
  Prefix: "&d&lPigRacing &8| &f"

  # Sent to everyone while a race is taking sign-ups. Clicking any line joins.
  # {time}, {seconds} ("second"/"seconds"), {players}, {laps}
  JoinRace:
    - "{center}&d&m                                                            "
    - "{center}&d&lPIG RACE"
    - "{center}&fA race starts in &d{time} {seconds}&f!"
    - "{center}&7{laps} laps  &8|  {players} joined so far"
    - ""
    - "{center}&d&l[ CLICK TO JOIN ]"
    - "{center}&d&m                                                            "
  JoinHover: "&fClick to join the race\n&7or type &d/race join"
  Joined:
    - "{center}&d&m                                                            "
    - "{center}&d&lYOU'RE IN!"
    - "{center}&fThe race starts when sign-ups close."
    - "{center}&7Leave any time with &d/race leave"
    - "{center}&d&m                                                            "
  JoinedBroadcast: "{prefix}&d{player} &fjoined the race &7({amount} racing)"
  LeftBroadcast: "{prefix}&d{player} &fleft the race &7({amount} racing)"
  Leave: "{prefix}&fYou left the race."
  NoCurrentRace: "{prefix}&cThere's no race running right now."
  AlreadyInRace: "{prefix}&cYou're already in this race."
  AlreadyStarted: "{prefix}&cThis race has already started. Catch the next one!"
  NotInRace: "{prefix}&cYou're not in a race."
  # To the racers who did join
  NotEnoughPlayers: "{prefix}&cNot enough racers joined. A race needs at least &f{min}&c."
  RaceCancelled: "{prefix}&fThe pig race was cancelled: it needs at least &d{min} &fracers."
  RaceVoided: "{prefix}&fThe pig race was called off: nobody is racing."
  LapComplete: "{prefix}&fLap &d{lap}&7/&d{total} &fcomplete &8| &7{time}"
  CompleteBroadcast: "{prefix}&d{player} &ffinished &d{position} &7({time})"
  # Sent when the last racer finishes. {results} becomes one ResultLine per finisher.
  RaceOver:
    - "{center}&d&m                                                            "
    - "{center}&d&lRACE RESULTS"
    - ""
    - "{results}"
    - ""
    - "{center}&7Thanks for racing!"
    - "{center}&d&m                                                            "
  ResultLine: "{center}&d&l{position}  &f{player}  &7{time}"
  OutOfBounds: "{prefix}&cOut of bounds! &fBack to your last ring."
  DismountMessage: "{prefix}&cYou can't get off mid-race. &fType &d/race leave &fto quit."
  CommandBlocked: "{prefix}&cYou can't use that here. &fType &d/race leave &fto quit the race."
  NoPermission: "{prefix}&cYou don't have permission to do that."
  PlayersOnly: "{prefix}&cOnly players can do that."
  Help:
    Header:
      - "{center}&d&m                                                            "
      - "{center}&d&lPIG RACING"
      - ""
    Player:
      - "&d/{label} join &8- &fJoin the race that's starting"
      - "&d/{label} leave &8- &fLeave the race"
    Admin:
      - ""
      - "{center}&7Running races"
      - "&d/{label} start &8- &fOpen a race for sign-ups"
      - "&d/{label} forcestart &8- &fSkip the join timer and start now"
      - "&d/{label} stop &8- &fStop the current race"
      - "&d/{label} reload &8- &fReload the config"
      - ""
      - "{center}&7Building the track"
      - "&d/{label} setwaitingloc &8- &fWhere racers wait, here"
      - "&d/{label} setstartloc &8- &fThe start, here, facing where you look"
      - "&d/{label} addcheckpoint [size] &8- &fA ring here, facing where you look"
      - "&d/{label} removecheckpoint [n] &8- &fRemove a ring (the last by default)"
      - "&d/{label} resetcheckpoints &8- &fRemove every ring"
      - "&d/{label} preview &8- &fShow the rings while no race is on"
      - "&d/{label} pos1 &7/ &dpos2 &8- &fMark the boundary's corners"
      - "&d/{label} setboundary &7/ &dclearboundary &8- &fOptional race boundary"
    Footer:
      - "{center}&d&m                                                            "
  Admin:
    Reloaded: "{prefix}&fConfig reloaded."
    LocationSet: "{prefix}&fLocation saved."
    CornerSet: "{prefix}&fBoundary corner &d{corner} &fset to &d{position}&f."
    NeedSelection: "{prefix}&cMark both corners first with &f/race pos1 &cand &f/race pos2&c."
    SelectionWorlds: "{prefix}&cBoth corners have to be in the same world."
    BoundarySet: "{prefix}&fBoundary saved &7({size})&f. Racers leaving it go back to their last ring."
    BoundaryCleared: "{prefix}&fBoundary removed. Racers are kept near the start by distance instead."
    StartOutsideBoundary: "{prefix}&cHeads up: the start location is outside this boundary."
    # {number}, {size}, {direction}
    CheckpointAdded: "{prefix}&fRing &d#{number} &fadded &7(size {size}, facing {direction})"
    CheckpointRemoved: "{prefix}&fRing &d#{number} &fremoved. &7{count} left."
    NoSuchCheckpoint: "{prefix}&cThere's no ring with that number. The track has &f{count}&c."
    BadRingSize: "{prefix}&cRing size must be a whole number from 1 to {max}, e.g. &f/{label} addcheckpoint 3"
    CheckpointsReset: "{prefix}&fEvery ring removed."
    TrackInUse: "{prefix}&cA race is using the track. Stop it before changing the rings."
    PreviewOn: "{prefix}&fShowing the track's &d{count} &frings. Run it again to hide them."
    PreviewOff: "{prefix}&fTrack preview hidden."
    RaceAlreadyRunning: "{prefix}&cA race is already running. Stop it first with &f/race stop&c."
    CannotStart: "{prefix}&cCan't start a race: &f{reason}"
    RaceStopped: "{prefix}&fRace stopped."
    NothingToForceStart: "{prefix}&cNo race is taking sign-ups. Open one with &f/race start &cfirst."
    AlreadyUnderway: "{prefix}&cThe race has already started."
    ForceStarted: "{prefix}&fStarting now with &d{players} &fracers."
    ForceStartedEmpty: "{prefix}&cNobody had joined, so the race was called off."

Actionbar:
  # {players}, {min}, {time} (seconds left)
  Waiting: "&fWaiting for racers  &8|  &d{players}&7/&d{min}  &8|  &fStarts in &d{time}s"
  Starting: "&d&lGet ready..."
  # {lap}, {total}, {ring} (rings passed this lap), {rings}, {speed} (top speed, blocks/s), {time}
  Racing: "&fLap &d{lap}&7/&d{total}   &8|   &fRing &d{ring}&7/&d{rings}   &8|   &d{time}"
  # {position}, {time}
  Finished: "&fYou finished &d{position} &fin &d{time}"

# Set with the admin commands above
Data:
  WaitingLocation: ""
  StartLocation: ""
