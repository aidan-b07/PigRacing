name: Feature request
description: Suggest something new for Pig Racing, or a change to something that exists
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please check the [open issues](https://github.com/aidan-b07/PigRacing/issues) first in case someone has already suggested it. If they have, add a thumbs up to theirs instead.

  - type: textarea
    id: problem
    attributes:
      label: What would this help with?
      description: The problem you're running into, or what you're trying to do on your server.
      placeholder: My players finish at very different times, so the fastest ones are left waiting in the lobby.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
      description: How you'd picture it working. Commands, config options, how it looks in a race, anything.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
      description: Workarounds, or other plugins that do something similar.

  - type: dropdown
    id: area
    attributes:
      label: Which part of the plugin is it about?
      multiple: true
      options:
        - Flying and steering
        - Rings and tracks
        - Joining, the lobby or the countdown
        - Results and rewards
        - Scheduled races or the time limit
        - Commands and permissions
        - Config or messages
        - Support for another plugin
        - Something else
